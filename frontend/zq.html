<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>山水 · 明月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--serif:"Songti SC","STSong","Noto Serif SC",serif;--sans:"PingFang SC","Microsoft YaHei",sans-serif}
html,body{height:100%;overflow:hidden;background:#05070f;font-family:var(--serif)}
.loader{position:fixed;inset:0;z-index:99;background:#020205;display:flex;align-items:center;justify-content:center;color:#b8b0a0;letter-spacing:.3em;font-size:13px;transition:opacity .8s ease}
.loader.hide{opacity:0;pointer-events:none}
.scene{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transform:scale(1);transition:opacity 1.6s ease,filter 1.6s ease;animation:kb 22s linear infinite alternate}
.scene.active{opacity:1;z-index:1}
@keyframes kb{to{transform:scale(1.14) translate(2%,-1%)}}
.vignette{position:fixed;inset:0;z-index:2;background:radial-gradient(circle at 50% 40%,transparent 0%,rgba(0,0,0,.45) 70%,rgba(0,0,0,.85) 100%);pointer-events:none}
.moon{position:fixed;z-index:3;border-radius:50%;background-image:url(assets/moon_nasa.jpg);background-size:cover;background-position:center;
  box-shadow:0 0 60px 18px var(--glow),0 0 160px 60px rgba(255,245,210,.18);pointer-events:none;transition:all 1.6s ease;
  animation:moonFloat 9s ease-in-out infinite}
@keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bokeh{position:fixed;inset:0;z-index:3;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(8px);opacity:0;animation:orbDrift linear infinite}
@keyframes orbDrift{0%{transform:translateY(0) translateX(0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
.content{position:fixed;left:0;right:0;bottom:17%;z-index:4;text-align:center;padding:0 8%;pointer-events:none}
.title{font-size:clamp(42px,13vw,86px);font-weight:600;letter-spacing:.22em;color:transparent;
  background:linear-gradient(180deg,#fff8e0,#e6c070 55%,#c89440);-webkit-background-clip:text;background-clip:text;
  text-shadow:0 0 50px rgba(236,200,112,.35);opacity:0;transform:translateY(18px);transition:opacity 1.2s ease,transform 1.2s ease}
.sub{margin-top:14px;font-size:clamp(18px,5vw,30px);color:#f0e8d8;letter-spacing:.14em;text-shadow:0 2px 24px rgba(0,0,0,.6);
  opacity:0;transform:translateY(14px);transition:opacity 1.2s ease .25s,transform 1.2s ease .25s}
.verse{margin-top:10px;font-size:clamp(14px,4vw,21px);color:#d8cfb8;letter-spacing:.08em;line-height:1.9;
  text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);transition:opacity 1.2s ease .45s,transform 1.2s ease .45s}
.show{opacity:1!important;transform:none!important}
.dots{position:fixed;bottom:36px;left:0;right:0;z-index:5;display:flex;justify-content:center;gap:12px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:.4s}
.dot.active{background:rgba(236,200,112,.9);box-shadow:0 0 10px rgba(236,200,112,.6)}
.hint{position:fixed;bottom:12px;left:0;right:0;z-index:5;text-align:center;font-family:var(--sans);font-size:11px;color:#6b6b7b;letter-spacing:.18em;opacity:0;animation:fin 1.5s ease 2s forwards}
@keyframes fin{to{opacity:1}}
</style>
</head>
<body>
<div class="loader" id="loader">正在点亮月光...</div>
<div class="scene active" style="--img:url(assets/moon_uns.jpg)"></div>
<div class="scene" style="--img:url(assets/land3.jpg)"></div>
<div class="scene" style="--img:url(assets/land4.jpg)"></div>
<div class="scene" style="--img:url(assets/land1.jpg)"></div>
<div class="vignette"></div>
<div class="moon" id="moon" style="--glow:rgba(255,250,230,.42)"></div>
<div class="bokeh" id="bokeh"></div>
<div class="content" id="content">
  <div class="title" id="title">山水 · 明月</div>
  <div class="sub" id="sub">云海之上</div>
  <div class="verse" id="verse">愿逐月华流照君。</div>
</div>
<div class="dots" id="dots"></div>
<div class="hint">轻触切换 · 自动流转</div>
<script>
const scenes=[
  {img:'assets/moon_uns.jpg',filter:'brightness(0.62) contrast(1.18) saturate(0.72) hue-rotate(-12deg)',moon:{t:'9%',r:'8%',s:'clamp(130px,28vw,230px)',g:'rgba(255,250,230,.42)'},sub:'云海之上',pool:['愿逐月华流照君。','云深不知处，明月照人来。','轻舟已过万重山。','且将新火试新茶，诗酒趁年华。']},
  {img:'assets/land3.jpg',filter:'brightness(0.52) contrast(1.25) saturate(0.65) hue-rotate(-5deg)',moon:{t:'15%',r:'12%',s:'clamp(110px,22vw,190px)',g:'rgba(255,245,220,.38)'},sub:'海上明月',pool:['海上生明月，天涯共此时。','春江潮水连海平，海上明月共潮生。','潮起潮落，月亏月圆。','露从今夜白，月是故乡明。']},
  {img:'assets/land4.jpg',filter:'brightness(0.66) contrast(1.12) saturate(0.62) hue-rotate(-18deg)',moon:{t:'7%',r:'10%',s:'clamp(150px,30vw,250px)',g:'rgba(255,250,230,.45)'},sub:'天山明月',pool:['明月出天山，苍茫云海间。','山高月小，水落石出。','白雪却嫌春色晚，故穿庭树作飞花。','长风几万里，吹度玉门关。']},
  {img:'assets/land1.jpg',filter:'brightness(0.6) contrast(1.15) saturate(0.7) hue-rotate(-10deg)',moon:{t:'11%',r:'14%',s:'clamp(120px,24vw,210px)',g:'rgba(255,245,220,.4)'},sub:'山水有情',pool:['但愿人长久，千里共婵娟。','青山一道同云雨，明月何曾是两乡。','采菊东篱下，悠然见南山。','人生得意须尽欢，莫使金樽空对月。']}
];
const sceneEls=document.querySelectorAll('.scene');
const moonEl=document.getElementById('moon');
const titleEl=document.getElementById('title');
const subEl=document.getElementById('sub');
const verseEl=document.getElementById('verse');
const dotEls=Array.from({length:scenes.length},(_,i)=>{const d=document.createElement('div');d.className='dot';document.getElementById('dots').appendChild(d);return d});
let idx=0,counter=[0,0,0,0],timer=null;
function pick(i){const p=scenes[i].pool;return p[counter[i]%p.length]}
function apply(i){
  sceneEls.forEach((el,j)=>{el.classList.toggle('active',j===i);el.style.backgroundImage=scenes[j].img;el.style.filter=scenes[i].filter});
  const m=scenes[i].moon; moonEl.style.top=m.t; moonEl.style.right=m.r; moonEl.style.width=m.s; moonEl.style.height=m.s; moonEl.style.setProperty('--glow',m.g);
  dotEls.forEach((d,j)=>d.classList.toggle('active',j===i));
  subEl.classList.remove('show'); verseEl.classList.remove('show');
  setTimeout(()=>{subEl.textContent=scenes[i].sub;verseEl.textContent=pick(i);subEl.classList.add('show');verseEl.classList.add('show');counter[i]++;},260);
}
function next(){apply(idx=(idx+1)%scenes.length)}
function start(){clearInterval(timer);timer=setInterval(next,8500)}
window.addEventListener('load',()=>{apply(0);titleEl.classList.add('show');document.getElementById('loader').classList.add('hide');start();});
window.addEventListener('pointerdown',()=>{next();start();});
(function(){const b=document.getElementById('bokeh');const n=innerWidth<480?18:28;
for(let i=0;i<n;i++){const o=document.createElement('div');o.className='orb';
  const sz=4+Math.random()*18;o.style.width=o.style.height=sz+'px';
  o.style.left=(Math.random()*100)+'%';o.style.top=(100+Math.random()*30)+'%';
  o.style.background='radial-gradient(circle,'+(Math.random()<.5?'rgba(236,200,112,.85)':'rgba(255,255,255,.8)')+',transparent)';
  o.style.setProperty('--dx',(Math.random()*120-60)+'px');o.style.animationDelay=(Math.random()*6)+'s';o.style.animationDuration=(7+Math.random()*7)+'s';b.appendChild(o);}})();
</script>
</body>
</html>
