<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>中秋快乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --gold:#ecc870;--ink:#f5edd8;--soft:#cdbfa0;
    --serif:"Songti SC","STSong","Noto Serif SC",serif;
  }
  html,body{height:100%;overflow:hidden}
  body{background:#05070f;font-family:var(--serif);color:var(--ink);position:relative}

  /* 夜空 */
  .sky{position:fixed;inset:0;z-index:0;
    background:radial-gradient(1200px 820px at 72% 14%,rgba(96,116,184,.40),transparent 60%),
               radial-gradient(1000px 760px at 20% 88%,rgba(140,82,158,.30),transparent 62%),
               linear-gradient(168deg,#070b1e 0%,#0a1233 40%,#1b1340 78%,#241640 100%);}
  .horizon{position:fixed;left:0;right:0;bottom:0;height:46%;z-index:0;
    background:linear-gradient(0deg,rgba(236,200,112,.10),transparent);}

  /* 星空 / 流星 */
  #stars,#shooting,#lanterns,#petals,#fireworks{position:fixed;inset:0;z-index:1;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 3.4s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
  .shoot{position:absolute;width:150px;height:1.6px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
    transform:rotate(-32deg);filter:drop-shadow(0 0 7px #fff)}

  /* 月亮：辉光 + 月海 + 桂树影 */
  .moon{position:fixed;top:6%;right:8%;width:clamp(120px,30vw,200px);aspect-ratio:1;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 38% 34%,#fffdf4 0%,#fff4c8 28%,#f7d98c 56%,#ecc069 80%,#d6a948 100%);
    box-shadow:0 0 70px 20px rgba(255,223,152,.45),0 0 190px 70px rgba(255,223,152,.20),
               inset -20px -16px 46px rgba(150,100,28,.55);
    animation:mglow 8s ease-in-out infinite}
  @keyframes mglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
  .moon .c{position:absolute;border-radius:50%;background:rgba(150,108,40,.32);box-shadow:inset 3px 4px 9px rgba(110,72,18,.5)}
  .moon .tree{position:absolute;left:30%;top:30%;width:38%;height:48%;opacity:.26;
    background:radial-gradient(circle at 50% 12%,rgba(120,85,30,.9) 0 8%,transparent 9%),
              radial-gradient(circle at 38% 40%,rgba(120,85,30,.85) 0 16%,transparent 17%),
              radial-gradient(circle at 64% 52%,rgba(120,85,30,.8) 0 13%,transparent 14%),
              radial-gradient(circle at 50% 78%,rgba(120,85,30,.8) 0 10%,transparent 11%);
    filter:blur(.4px)}

  /* 云 */
  .cloud{position:fixed;z-index:1;border-radius:50%;filter:blur(26px);opacity:.18;
    background:linear-gradient(90deg,#aeb8ec,#7e88c8)}
  .cloud.c1{width:260px;height:72px;top:22%;left:-280px;animation:drift 46s linear infinite}
  .cloud.c2{width:340px;height:92px;top:60%;left:-380px;opacity:.13;animation:drift 60s linear infinite 8s}
  .cloud.c3{width:200px;height:60px;top:40%;left:-260px;opacity:.10;animation:drift 52s linear infinite 4s}
  @keyframes drift{to{transform:translateX(150vw)}}

  /* 远山剪影 */
  .hills{position:fixed;left:0;right:0;bottom:0;z-index:2;width:100%;height:34vh;pointer-events:none}
  .hills svg{width:100%;height:100%;display:block}

  /* 竖排书法 */
  .poem{position:fixed;left:6%;top:50%;transform:translateY(-50%);z-index:4;writing-mode:vertical-rl;
    font-size:clamp(20px,5.4vw,30px);color:var(--ink);letter-spacing:.32em;font-weight:600;
    text-shadow:0 2px 26px rgba(236,200,112,.5),0 0 2px rgba(0,0,0,.3);
    opacity:0;animation:fin 1.8s ease .4s forwards}
  .seal{position:fixed;left:calc(6% + 4px);top:calc(50% + 40%);z-index:4;writing-mode:vertical-rl;
    font-size:clamp(13px,3.4vw,18px);color:#e7b9b0;letter-spacing:.18em;
    border:1px solid rgba(231,185,176,.55);padding:6px 3px;border-radius:4px;opacity:0;animation:fin 1.4s ease 1.4s forwards}

  /* 中央标题 */
  .center{position:fixed;left:0;right:0;top:34%;z-index:4;text-align:center;pointer-events:none}
  .title{font-size:clamp(46px,14vw,96px);font-weight:700;letter-spacing:.16em;
    background:linear-gradient(180deg,#fff6da,#f3d27e 55%,#e3b35a);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(236,200,112,.55);animation:float 6s ease-in-out infinite;opacity:0;animation:fin 1.6s ease .2s forwards,float 6s ease-in-out 1.8s infinite}
  .bless{margin-top:14px;font-size:clamp(15px,4.2vw,21px);color:var(--soft);letter-spacing:.22em;
    text-shadow:0 1px 18px rgba(0,0,0,.4);opacity:0;animation:fin 1.6s ease 1s forwards}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes fin{to{opacity:1}}

  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:#6b7a99;z-index:5;letter-spacing:.5px;
    opacity:0;animation:fin 1.5s ease 2.4s forwards}
</style>
</head>
<body>
  <div class="sky"></div><div class="horizon"></div>
  <div class="moon"><div class="c" style="width:22%;height:22%;left:28%;top:24%"></div>
    <div class="c" style="width:13%;height:13%;left:60%;top:58%"></div>
    <div class="c" style="width:9%;height:9%;left:46%;top:70%"></div>
    <div class="tree"></div></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div id="stars"></div><div id="shooting"></div><div id="lanterns"></div>
  <div id="petals"></div><div id="fireworks"></div>

  <div class="hills">
    <svg viewBox="0 0 1000 340" preserveAspectRatio="none">
      <path d="M0,340 L0,210 C140,150 240,250 360,200 C480,150 560,260 700,205 C820,160 920,250 1000,205 L1000,340 Z" fill="#0b1230" opacity=".9"/>
      <path d="M0,340 L0,260 C160,210 300,300 460,255 C620,210 760,300 1000,250 L1000,340 Z" fill="#070c22" opacity=".95"/>
      <g fill="#05070f" opacity=".9">
        <path d="M700,255 l8,-46 l8,46 z"/>
        <rect x="704" y="250" width="8" height="14"/>
        <path d="M150,300 l10,-60 l10,60 z"/>
        <rect x="155" y="294" width="10" height="16"/>
      </g>
    </svg>
  </div>

  <div class="poem" id="poem">花好月圆人长久</div>
  <div class="seal">中秋</div>
  <div class="center"><div class="title">中秋快乐</div><div class="bless" id="bless"></div></div>
  <div class="hint">轻触屏幕，点亮一盏灯 🏮</div>

<script>
  const small = innerWidth < 480;
  // 星空
  (function(){const b=document.getElementById('stars');const n=small?90:150;
    for(let i=0;i<n;i++){const s=document.createElement('div');s.className='star';
      const sz=Math.random()*2.2+0.8;s.style.width=s.style.height=sz+'px';
      s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
      s.style.animationDelay=(Math.random()*3.4)+'s';s.style.animationDuration=(2+Math.random()*2.6)+'s';b.appendChild(s);}})();

  // 流星
  function shoot(){const box=document.getElementById('shooting');const s=document.createElement('div');s.className='shoot';
    s.style.left=(Math.random()*55+10)+'%';s.style.top=(Math.random()*38)+'%';
    const dur=1300+Math.random()*800;
    s.animate([{opacity:0,transform:'rotate(-32deg) translateX(0)'},
               {opacity:1,offset:.15,transform:'rotate(-32deg) translateX(0)'},
               {opacity:0,transform:'rotate(-32deg) translateX(170px)'}],
              {duration:dur,easing:'ease-out'});
    setTimeout(()=>s.remove(),dur);}
  setInterval(()=>{if(Math.random()<.7)shoot();},1500);

  // 飘升灯笼
  const lanterns=['🏮','🏮','🏮','🌕','✨','💛'];
  function lantern(){const box=document.getElementById('lanterns');const l=document.createElement('div');
    l.textContent=lanterns[Math.floor(Math.random()*lanterns.length)];
    l.style.cssText='position:absolute;bottom:-44px;left:'+(Math.random()*100)+'%;font-size:'+(16+Math.random()*16)+'px;opacity:.95';
    const dx=(Math.random()*80-40)+'px',dur=3800+Math.random()*2600;
    l.animate([{transform:'translateY(0) translateX(0) rotate(0)',opacity:.95},
               {transform:'translateY(-118vh) translateX('+dx+') rotate(22deg)',opacity:0}],
              {duration:dur,easing:'linear'});
    box.appendChild(l);setTimeout(()=>l.remove(),dur);}
  setInterval(lantern, small?650:480);

  // 落桂 / 花瓣
  function petal(){const box=document.getElementById('petals');const p=document.createElement('div');
    const gold=Math.random()<.5;
    p.style.cssText='position:absolute;top:-12px;left:'+(Math.random()*100)+'%;width:'+(3+Math.random()*3)+'px;height:'+(3+Math.random()*3)+'px;border-radius:50%;'+
      'background:'+(gold?'rgba(236,200,112,.9)':'rgba(255,255,255,.85)')+';box-shadow:0 0 6px '+(gold?'rgba(236,200,112,.8)':'rgba(255,255,255,.7)');
    const dx=(Math.random()*120-60)+'px',dur=6000+Math.random()*4000,rot=(Math.random()*360)+'deg';
    p.animate([{transform:'translateY(0) translateX(0) rotate(0)',opacity:0},
               {opacity:1,offset:.1},
               {transform:'translateY(106vh) translateX('+dx+') rotate('+rot+')',opacity:.2}],
              {duration:dur,easing:'linear'});
    box.appendChild(p);setTimeout(()=>p.remove(),dur);}
  setInterval(petal, small?180:120);

  // 烟花
  function firework(){const box=document.getElementById('fireworks');
    const x=20+Math.random()*60,y=12+Math.random()*32;
    const hue=Math.random()<.5?'236,200,112':'255,170,180';
    const N=small?16:26;
    for(let i=0;i<N;i++){const p=document.createElement('div');
      p.style.cssText='position:absolute;left:'+x+'%;top:'+y+'%;width:3px;height:3px;border-radius:50%;background:rgba('+hue+',1);box-shadow:0 0 8px rgba('+hue+',.9)';
      const ang=(Math.PI*2*i)/N,dist=40+Math.random()*50;
      p.animate([{transform:'translate(0,0) scale(1)',opacity:1},
                 {transform:'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist)+'px) scale(.3)',opacity:0}],
                {duration:1100+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'});
      box.appendChild(p);setTimeout(()=>p.remove(),1600);}
  }
  setInterval(firework, 2200);
  setTimeout(firework,600);

  // 祝福语
  const BLESS=["愿人长久，千里共婵娟。","花好月圆，岁岁安康。","月满中秋，情满人间。","海上生明月，天涯共此时。","但愿人长久，年年共清辉。"];
  document.getElementById('bless').textContent=BLESS[Math.floor(Math.random()*BLESS.length)];

  // 轻触：在点击处放烟花 + 涟漪 + 升起几盏灯（明显反馈）
  function burstAt(px,py){
    const box=document.getElementById('fireworks');
    const hue=Math.random()<.5?'236,200,112':'255,170,180';
    const N=small?18:28;
    for(let i=0;i<N;i++){const p=document.createElement('div');
      p.style.cssText='position:fixed;left:'+px+'px;top:'+py+'px;width:3px;height:3px;border-radius:50%;background:rgba('+hue+',1);box-shadow:0 0 9px rgba('+hue+',.9);z-index:7';
      const ang=(Math.PI*2*i)/N,dist=50+Math.random()*70;
      p.animate([{transform:'translate(-50%,-50%) translate(0,0) scale(1)',opacity:1},
                 {transform:'translate(-50%,-50%) translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist)+'px) scale(.2)',opacity:0}],
                {duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'});
      box.appendChild(p);setTimeout(()=>p.remove(),1700);}
    const r=document.createElement('div');
    r.style.cssText='position:fixed;left:'+px+'px;top:'+py+'px;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.85);transform:translate(-50%,-50%);z-index:7';
    r.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:.9},{transform:'translate(-50%,-50%) scale(15)',opacity:0}],
              {duration:900,easing:'ease-out'});
    document.body.appendChild(r);setTimeout(()=>r.remove(),950);
    for(let k=0;k<4;k++){const l=document.createElement('div');l.textContent='🏮';
      l.style.cssText='position:fixed;z-index:6;left:'+(px+(Math.random()*60-30))+'px;top:'+py+'px;font-size:24px;pointer-events:none';
      const dx=(Math.random()*80-40)+'px',dur=3200+Math.random()*2200;
      l.animate([{transform:'translateY(0) rotate(0)',opacity:1},
                 {transform:'translateY(-110vh) translateX('+dx+') rotate(22deg)',opacity:0}],
                {duration:dur,easing:'linear'});
      document.body.appendChild(l);setTimeout(()=>l.remove(),dur);}
  }
  window.addEventListener('pointerdown',e=>{ burstAt(e.clientX,e.clientY); });
</script>
</body>
</html>
