<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>中秋快乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --ink:#f4ecd8;--gold:#e8c878;--soft:#cdbfa0;
    --kw:#e6bd86;--str:#e2a6bb;--com:#7f8aa6;--fn:#9ad6cf;--op:#d392ac;--txt:#e9e7e0;
    --serif:"Songti SC","STSong","Noto Serif SC",serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  html,body{height:100%}
  body{font-family:var(--mono);background:#05070f;color:var(--txt);overflow:hidden;position:relative}

  /* 背景：夜空丝绢渐变 */
  .bg{position:fixed;inset:0;z-index:0;
    background:radial-gradient(1100px 760px at 74% 12%,rgba(86,104,168,.34),transparent 60%),
               radial-gradient(900px 720px at 14% 90%,rgba(132,78,150,.26),transparent 62%),
               linear-gradient(165deg,#070b1c 0%,#0a1230 42%,#1a1238 100%);}
  #stars,#shooting{position:fixed;inset:0;z-index:1;pointer-events:none}
  .star{position:absolute;background:#fff;border-radius:50%;animation:tw 3.4s infinite ease-in-out}
  @keyframes tw{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.95;transform:scale(1)}}
  .shoot{position:absolute;width:140px;height:1.4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff,rgba(255,255,255,0));
    transform:rotate(-32deg);opacity:0;filter:drop-shadow(0 0 6px #fff)}

  /* 月亮：真实辉光 + 月海 + 陨石坑 */
  .moon{position:fixed;top:7%;right:9%;width:clamp(110px,26vw,168px);aspect-ratio:1;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 38% 34%,#fffdf3 0%,#fff3c4 30%,#f6d889 58%,#e9bd5e 80%,#d4a747 100%);
    box-shadow:0 0 60px 18px rgba(255,221,150,.42),0 0 160px 60px rgba(255,221,150,.18),
               inset -18px -14px 40px rgba(150,100,28,.5);
    animation:moonGlow 8s ease-in-out infinite}
  .moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(150,108,40,.30);
    box-shadow:inset 3px 4px 8px rgba(110,72,18,.45)}
  .moon::before{width:22%;height:22%;top:24%;left:30%;box-shadow:inset 3px 4px 8px rgba(110,72,18,.45),
    26px 30px 0 -3px rgba(150,108,40,.24),-10px 46px 0 -5px rgba(150,108,40,.18)}
  .moon::after{width:13%;height:13%;top:58%;left:60%;box-shadow:inset 2px 2px 5px rgba(110,72,18,.45)}

  /* 竖排书法标题 */
  .title{position:fixed;left:7%;top:50%;transform:translateY(-50%);z-index:3;writing-mode:vertical-rl;
    font-family:var(--serif);font-size:clamp(34px,9vw,62px);color:var(--ink);letter-spacing:.28em;
    font-weight:600;text-shadow:0 2px 24px rgba(232,200,120,.45),0 0 2px rgba(0,0,0,.3);
    opacity:0;animation:fadeIn 2s ease 2.6s forwards}
  .seal{position:fixed;left:calc(7% + 6px);top:calc(50% + 38%);z-index:3;writing-mode:vertical-rl;
    font-family:var(--serif);font-size:clamp(13px,3.4vw,18px);color:#e7b9b0;letter-spacing:.2em;
    border:1px solid rgba(231,185,176,.5);padding:5px 3px;border-radius:4px;opacity:0;
    animation:fadeIn 1.6s ease 3.6s forwards}
  @keyframes fadeIn{to{opacity:1}}

  /* 终端卡片 */
  .wrap{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:18px}
  .editor{width:min(640px,94vw);background:rgba(10,14,28,.55);border:1px solid rgba(232,200,120,.16);
    border-radius:18px;overflow:hidden;backdrop-filter:blur(18px);box-shadow:0 40px 100px rgba(0,0,0,.6)}
  .bar{display:flex;align-items:center;gap:8px;padding:13px 17px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
  .dot{width:11px;height:11px;border-radius:50%}.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .file{margin-left:9px;font-size:12.5px;color:#9aa6c2}
  .run{margin-left:auto;font-size:11px;color:#9ad6cf;border:1px solid rgba(154,214,207,.3);padding:4px 11px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .run i{width:6px;height:6px;border-radius:50%;background:#28c840;box-shadow:0 0 8px #28c840;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .code{padding:20px 20px 10px;font-size:clamp(12px,3.5vw,14.5px);line-height:1.95;white-space:pre-wrap;word-break:break-word;min-height:150px}
  .kw{color:var(--kw)}.str{color:var(--str)}.com{color:var(--com);font-style:italic}.fn{color:var(--fn)}.op{color:var(--op)}.p{color:var(--txt)}
  .caret{display:inline-block;width:7px;height:16px;background:var(--gold);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite;border-radius:1px}
  @keyframes blink{50%{opacity:0}}
  #out{padding:2px 22px 16px;opacity:0;transform:translateY(8px);transition:.8s ease}
  #out.show{opacity:1;transform:none}
  .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(232,200,120,.5),transparent);margin:10px 0 18px}
  .reslabel{font-size:10.5px;color:var(--com);margin-bottom:6px;letter-spacing:1px}
  .letter{font-family:var(--serif);font-size:clamp(15px,4.4vw,19px);line-height:2.1;color:var(--ink);letter-spacing:.06em;
    white-space:pre-wrap;text-shadow:0 1px 18px rgba(232,200,120,.25)}
  .acts{display:flex;gap:10px;padding:6px 22px 22px}
  .acts button{flex:1;padding:12px;border-radius:11px;border:1px solid rgba(232,200,120,.26);background:rgba(255,255,255,.04);
    color:#dce8ff;font-size:13px;cursor:pointer;font-family:var(--mono);transition:.2s}
  .acts button:active{background:rgba(255,255,255,.1)}
  .toast{position:fixed;left:50%;bottom:46px;transform:translateX(-50%);z-index:9;background:rgba(16,22,42,.96);
    border:1px solid rgba(232,200,120,.45);color:var(--ink);padding:12px 20px;border-radius:999px;font-size:13px;
    opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:#6b7a99;z-index:3;letter-spacing:.5px;
    opacity:0;animation:fadeIn 1.5s ease 4.5s forwards}
</style>
</head>
<body>
  <div class="bg"></div><div class="moon"></div>
  <div id="stars"></div><div id="shooting"></div>
  <div class="title">花好月圆人长久</div>
  <div class="seal">中秋</div>

  <div class="wrap">
    <div class="editor">
      <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="file">mid_autumn.py</span><span class="run"><i></i> 运行中</span></div>
      <div class="code"><span class="caret"></span></div>
      <div id="out">
        <div class="divider"></div>
        <div class="reslabel"># &gt;&gt;&gt; 运行结果</div>
        <div class="letter" id="letter"></div>
      </div>
      <div class="acts"><button id="cp">复制祝福</button><button id="rp">重新播放</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="hint">轻触屏幕，放一盏灯 🏮</div>

<script>
  // 星空
  (function(){const b=document.getElementById('stars');const n=innerWidth<480?80:130;
    for(let i=0;i<n;i++){const s=document.createElement('div');s.className='star';
      const sz=Math.random()*2+1;s.style.width=s.style.height=sz+'px';
      s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
      s.style.animationDelay=(Math.random()*3.4)+'s';s.style.animationDuration=(2+Math.random()*2.6)+'s';b.appendChild(s);}})();

  // 缓慢流星
  function shoot(){const box=document.getElementById('shooting');const s=document.createElement('div');s.className='shoot';
    const x=Math.random()*60+20,y=Math.random()*40;
    s.style.left=x+'%';s.style.top=y+'%';
    const dur=1400+Math.random()*900;
    s.animate([{opacity:0,transform:'rotate(-32deg) translateX(0)'},
               {opacity:1,offset:.15,transform:'rotate(-32deg) translateX(0)'},
               {opacity:0,transform:'rotate(-32deg) translateX(160px)'}],
              {duration:dur,easing:'ease-out'});
    setTimeout(()=>s.remove(),dur);
  }
  setInterval(()=>{if(Math.random()<.7)shoot();},2600);

  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);}
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const GREET=["愿你平安喜乐，万事胜意。","愿人长久，千里共婵娟。","愿所得皆所期，所行皆坦途。",
               "愿岁月温柔，故人安好。","愿今宵月色，照亮你整年路。","愿你被这世界，温柔以待。",
               "愿秋风有信，好事正酿。","愿你心有繁星，目之所及皆温柔。"];
  const BLESS=["中秋快乐，记得抬头看看月亮。","中秋安康，愿日子清亮如月。","佳节将至，遥寄一份惦念。",
               "月圆人圆，诸事皆圆。","一轮明月，寄去我的牵挂。","此夜月明，愿君无恙。"];

  // 真实可读的 Python 代码（自动运行）
  const CODE=[
    [['com','# 🌕 中秋快乐 · 写给你']],
    [['kw','from'],['p',' moon '],['kw','import'],['p',' sky, '],['fn','draw']],
    [['p','m '],['op','='],['p',' '],['fn','sky'],['p','('],['str','"2026-09-25"'],['p',')']],
    [['fn','draw'],['p','('],['p','moon'],['op','='],['p','m, '],['kw','stars'],['op','='],['p','True'],['p',')']],
    [['kw','for'],['p',' wish '],['kw','in'],['p',' m'],['p','.'],['fn','bless'],['p','():']],
    [['p','    '],['fn','print'],['p','('],['str','"中秋快乐"'],['p',')']]
  ];
  function typeCode(codeEl,caret){
    return (async()=>{
      for(const segs of CODE){
        for(const [cls,text] of segs){
          const span=document.createElement('span');if(cls!=='p')span.className=cls;
          codeEl.insertBefore(span,caret);
          for(const ch of text){span.textContent+=ch;await sleep(16);}
        }
        codeEl.insertBefore(document.createTextNode('\n'),caret);
        await sleep(140);
      }
    })();
  }

  function rand(a){return a[Math.floor(Math.random()*a.length)];}

  async function play(){
    const codeEl=document.querySelector('.code'),caret=codeEl.querySelector('.caret');
    const out=document.getElementById('out'),letter=document.getElementById('letter');
    out.classList.remove('show');letter.textContent='';caret.style.display='inline-block';
    codeEl.querySelectorAll('.ln').forEach(e=>e.remove());
    await typeCode(codeEl,caret);
    letter.innerHTML='<b style="color:var(--gold)">'+rand(GREET)+'</b>\n\n'+rand(BLESS);
    out.classList.add('show');caret.style.display='none';
    document.querySelector('.run').innerHTML='<i></i> 已完成';
  }
  play();

  const msg=()=>rand(GREET)+'\n\n'+rand(BLESS);
  document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(msg()).then(()=>toast('已复制祝福')).catch(()=>toast('复制失败'));};
  document.getElementById('rp').onclick=()=>{document.querySelector('.run').innerHTML='<i></i> 运行中';play();};

  // 轻触放灯
  const lights=['🏮','🌕','✨','💛','🌟'];
  document.body.addEventListener('click',e=>{
    if(['cp','rp'].includes(e.target.id))return;
    const l=document.createElement('div');l.textContent=lights[Math.floor(Math.random()*lights.length)];
    l.style.cssText='position:fixed;z-index:4;bottom:-40px;left:'+(Math.random()*100)+'%;font-size:24px;pointer-events:none';
    const dx=(Math.random()*60-30)+'px',dur=3200+Math.random()*2200;
    l.animate([{transform:'translateY(0) rotate(0)',opacity:1},
               {transform:'translateY(-118vh) translateX('+dx+') rotate(20deg)',opacity:0}],
              {duration:dur,easing:'linear'});
    document.body.appendChild(l);setTimeout(()=>l.remove(),dur);
  });
</script>
</body>
</html>
