<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视口诊断 DEBUG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;font-size:13px;background:#fff;color:#123;padding:12px;line-height:1.5}
.row{border-bottom:1px solid #eee;padding:5px 0;word-break:break-all}
.k{color:#07f;font-weight:bold}
.test{position:fixed;left:0;right:0;bottom:0;background:rgba(255,0,0,.4);color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:bold;height:40px}
h3{margin:6px 0}
a{color:#07f}
</style>
</head>
<body>
<h3>视口诊断（请横屏后截图发我）</h3>
<div id="out"></div>
<p><a href="index.html" target="_blank">→ 在同一无痕窗口打开游戏</a></p>
<div class="test" id="test">红条应贴着屏幕最底部（地址栏下方）</div>
<script>
function update(){
  var vv = window.visualViewport;
  var vvw = vv?Math.round(vv.width):null;
  var vvh = vv?Math.round(vv.height):null;
  var vvoT = vv?Math.round(vv.offsetTop):null;
  var vvoL = vv?Math.round(vv.offsetLeft):null;
  var d = {
    'innerWidth x innerHeight': window.innerWidth+' x '+window.innerHeight,
    'visualViewport w x h': vvw+' x '+vvh,
    'visualViewport offsetTop/Left': vvoT+' / '+vvoL,
    'visualViewport.scale': vv?vv.scale:null,
    'screen w x h': screen.width+' x '+screen.height,
    'screen.availW x availH': screen.availWidth+' x '+screen.availHeight,
    'devicePixelRatio': window.devicePixelRatio,
    'orientation.type': (screen.orientation&&screen.orientation.type)||'',
    'orientation.angle': (screen.orientation&&screen.orientation.angle),
    'documentElement.clientW x H': document.documentElement.clientWidth+' x '+document.documentElement.clientHeight
  };
  var html='';
  for(var k in d){ html += '<div class="row"><span class="k">'+k+'</span>: '+d[k]+'</div>'; }
  document.getElementById('out').innerHTML = html;
}
update();
window.addEventListener('resize', update);
window.addEventListener('orientationchange', function(){ setTimeout(update,300); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', update);
fetch('game.js?v='+Date.now()).then(function(r){return r.text();}).then(function(t){
  var has = t.indexOf('fitLayout')>=0;
  document.getElementById('out').innerHTML +=
    '<div class="row"><span class="k">game.js 是否含 fitLayout(应为 true)</span>: '+has+'</div>';
}).catch(function(e){
  document.getElementById('out').innerHTML += '<div class="row">fetch game.js 失败:'+e+'</div>';
});
</script>
</body>
</html>
