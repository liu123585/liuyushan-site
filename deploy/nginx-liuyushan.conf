# ===== Nginx 站点配置：liuyushan.top =====
# 用法：把本文件内容放到 /etc/nginx/conf.d/liuyushan.conf
#       （或 /etc/nginx/sites-available/liuyushan.conf 再软链到 sites-enabled）
# 说明：Node 服务(server.js)已在 127.0.0.1:3000 托管静态页 + /api，
#       所以 Nginx 只做「反向代理 + SSL 终止」，最简单也最不容易出错。

# ---- 80 端口：证书验证用 + 全站跳转 https ----
server {
    listen 80;
    server_name liuyushan.top www.liuyushan.top;

    # certbot 申请证书时的校验目录（申请证书前这行就位即可）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 证书下来后，取消下面这行注释，让 http 自动跳 https
    # location / { return 301 https://$host$request_uri; }
}

# ---- 443 端口：https 主体 ----
server {
    listen 443 ssl http2;
    server_name liuyushan.top www.liuyushan.top;

    # 免费 DV 证书路径（certbot 默认位置；用腾讯云/阿里云证书就改成你的路径）
    ssl_certificate     /etc/letsencrypt/live/liuyushan.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liuyushan.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 弹幕/新生墙上墙提交体积很小，给 2m 足够
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
